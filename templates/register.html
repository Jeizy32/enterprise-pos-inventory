<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Kasir Baru - Inventori Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; }
        .register-container { max-width: 400px; margin: 100px auto; }
    </style>
</head>
<body>

<div class="container register-container">
    <div class="card shadow border-0 rounded-3">
        <div class="card-header bg-success text-white text-center py-3">
            <h4 class="mb-0"><i class="fas fa-user-plus me-2"></i>Buat Akun Kasir</h4>
        </div>
        <div class="card-body p-4">
            
            <!-- Notifikasi Error/Sukses -->
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <!-- Form Register -->
            <form action="{{ url_for('register') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label text-muted fw-bold small">Username Kasir</label>
                    <input type="text" class="form-control" name="username" placeholder="Buat username..." required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted fw-bold small">Password Baru</label>
                    <input type="password" class="form-control" name="password" placeholder="Buat password rahasia..." required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold"><i class="fas fa-save me-1"></i> Daftar Sekarang</button>
            </form>
            
            <div class="text-center mt-3">
                <span class="text-muted small">Sudah punya akun?</span> 
                <a href="{{ url_for('login') }}" class="text-decoration-none fw-bold small text-success">Login di sini</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
